name: Build Sky Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex \
            git libelf-dev libssl-dev lz4 make python3 rsync unzip zip zstd \
            libncurses-dev gcc-aarch64-linux-gnu lld llvm

      - name: Checkout Kernel Source
        run: |
          git clone --depth=1 https://github.com/Caiqhsea/kernel_xiaomi_sm4450.git kernel_source

      - name: Set Environment Variables
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=aarch64-linux-gnu-ar" >> $GITHUB_ENV
          echo "LLVM=0" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Fix Device Tree Makefile
        run: |
          cd kernel_source
          git clone --depth=1 -b 16 https://github.com/Caiqhsea/device_xiaomi_sky-kernel.git /tmp/dtbs
          rm -rf arch/arm64/boot/dts/vendor
          mkdir -p arch/arm64/boot/dts/vendor
          cp /tmp/dtbs/dtbs/*.dtb arch/arm64/boot/dts/vendor/
          echo 'dtb-$(CONFIG_ARCH_QCOM) += 05_dtbdump_Qualcomm_Technologies,_Inc._Parrot_4Gb_SoC.dtb' >> arch/arm64/boot/dts/vendor/Makefile
          echo 'dtb-$(CONFIG_ARCH_QCOM) += 06_dtbdump_Qualcomm_Technologies,_Inc._Parrot_SoC.dtb' >> arch/arm64/boot/dts/vendor/Makefile
          echo 'dtb-$(CONFIG_ARCH_QCOM) += 07_dtbdump_Qualcomm_Technologies,_Inc._ParrotP_SoC.dtb' >> arch/arm64/boot/dts/vendor/Makefile

      - name: Remove hqsysfs Driver Completely
        run: |
          cd kernel_source
          # 删除 hqsysfs 目录
          rm -rf drivers/misc/hqsysfs
          echo "✅ hqsysfs directory removed"
          
          # 从 Kconfig 中删除引用
          sed -i '/source "drivers\/misc\/hqsysfs\/Kconfig"/d' drivers/misc/Kconfig
          echo "✅ hqsysfs removed from Kconfig"
          
          # 从 Makefile 中删除引用
          sed -i '/obj-$(CONFIG_HQSYSFS)/d' drivers/misc/Makefile
          sed -i '/hqsysfs/d' drivers/misc/Makefile
          echo "✅ hqsysfs removed from Makefile"
          
          # 验证
          echo "=== 验证删除 ==="
          grep -i hqsys drivers/misc/Makefile 2>/dev/null || echo "✅ Makefile 干净"
          grep -i hqsys drivers/misc/Kconfig 2>/dev/null || echo "✅ Kconfig 干净"
          ls -la drivers/misc/ | grep hqsys || echo "✅ 目录已删除"

      - name: Generate Defconfig
        run: |
          cd kernel_source
          echo "=== 配置内核 ==="
          
          # 启用 I2C 支持（OCP2131 依赖）
          echo "CONFIG_I2C=y" >> arch/arm64/configs/vendor/parrot_consolidate.config
          echo "CONFIG_I2C_BOARDINFO=y" >> arch/arm64/configs/vendor/parrot_consolidate.config
          echo "CONFIG_I2C_ALGOBIT=y" >> arch/arm64/configs/vendor/parrot_consolidate.config
          echo "CONFIG_I2C_SMBUS=y" >> arch/arm64/configs/vendor/parrot_consolidate.config
          echo "CONFIG_I2C_CHARDEV=y" >> arch/arm64/configs/vendor/parrot_consolidate.config
          
          # 启用 OCP2131_BIAS 驱动
          echo "CONFIG_OCP2131_BIAS=y" >> arch/arm64/configs/vendor/parrot_consolidate.config
          
          echo ""
          echo "=== 验证关键配置 ==="
          grep -E "CONFIG_I2C|CONFIG_OCP2131" arch/arm64/configs/vendor/parrot_consolidate.config
          
          make O=$GITHUB_WORKSPACE/out ARCH=arm64 vendor/parrot_consolidate.config
          
          echo ""
          echo "=== 最终 .config 中的 I2C 配置 ==="
          grep "CONFIG_I2C" $GITHUB_WORKSPACE/out/.config | head -10

      - name: Build Kernel and Modules
        run: |
          cd kernel_source
          echo "=== 1. 编译内核 (Image) ==="
          make O=$GITHUB_WORKSPACE/out -j$(nproc)
          
          echo ""
          echo "=== 2. 编译设备树 (dtbs) ==="
          make O=$GITHUB_WORKSPACE/out dtbs -j$(nproc)
          
          echo ""
          echo "=== 3. 编译内核模块 (modules) ==="
          make O=$GITHUB_WORKSPACE/out modules -j$(nproc)
          
          echo ""
          echo "=== 4. 安装模块到输出目录 ==="
          make O=$GITHUB_WORKSPACE/out modules_install INSTALL_MOD_PATH=$GITHUB_WORKSPACE/out/modules
          
          echo ""
          echo "=== 5. 检查编译结果 ==="
          echo "Image 大小："
          ls -lh $GITHUB_WORKSPACE/out/arch/arm64/boot/Image
          echo ""
          echo "模块数量："
          find $GITHUB_WORKSPACE/out/modules -name "*.ko" 2>/dev/null | wc -l
          echo ""
          echo "模块目录大小："
          du -sh $GITHUB_WORKSPACE/out/modules/ 2>/dev/null || echo "没有模块目录"
          echo ""
          echo "设备树文件："
          find $GITHUB_WORKSPACE/out/arch/arm64/boot/dts -name "*.dtb" 2>/dev/null | head -5

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: ${{ github.workspace }}/out/arch/arm64/boot/Image
          if-no-files-found: error

      - name: Upload Kernel Modules
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Modules
          path: ${{ github.workspace }}/out/modules/
          if-no-files-found: warn

      - name: Upload Device Tree Blobs
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-DTBS
          path: ${{ github.workspace }}/out/arch/arm64/boot/dts/
          if-no-files-found: warn

      - name: Upload Full Kernel Build (所有文件打包)
        if: always()
        run: |
          cd $GITHUB_WORKSPACE/out
          zip -r $GITHUB_WORKSPACE/full-kernel-build.zip \
            arch/arm64/boot/Image \
            arch/arm64/boot/dts/ \
            modules/ \
            .config \
            2>/dev/null || echo "部分文件不存在"
          echo "完整内核包大小："
          ls -lh $GITHUB_WORKSPACE/full-kernel-build.zip 2>/dev/null || echo "打包失败"

      - name: Upload Full Kernel Build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Full-Kernel-Build
          path: ${{ github.workspace }}/full-kernel-build.zip
          if-no-files-found: warn
