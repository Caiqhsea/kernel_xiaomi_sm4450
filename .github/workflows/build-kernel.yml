          name: Kernel-Sky-Image
          path: ${{ github.workspace }}/out/arch/arm64/boot/Image
          if-no-files-found: error          mkdir -p arch/arm64/boot/dts/vendor
          cp /tmp/dtbs/dtbs/*.dtb arch/arm64/boot/dts/vendor/
          echo 'dtb-$(CONFIG_ARCH_QCOM) += 05_dtbdump_Qualcomm_Technologies,_Inc._Parrot_4Gb_SoC.dtb' >> arch/arm64/boot/dts/vendor/Makefile
          echo 'dtb-$(CONFIG_ARCH_QCOM) += 06_dtbdump_Qualcomm_Technologies,_Inc._Parrot_SoC.dtb' >> arch/arm64/boot/dts/vendor/Makefile
          echo 'dtb-$(CONFIG_ARCH_QCOM) += 07_dtbdump_Qualcomm_Technologies,_Inc._ParrotP_SoC.dtb' >> arch/arm64/boot/dts/vendor/Makefile

      - name: Manually Fix Source Code and Generate Defconfig
        run: |
          cd kernel_source
          # 使用 Python 精准修改源码，绝对不丢字符
          python3 - << 'EOF'
          # 1. 补上头文件
          with open('drivers/misc/ocp2131_bias/ocp2131_bias.c', 'r') as f:
              content = f.read()
          if '#include <linux/i2c.h>' not in content:
              content = '#include <linux/i2c.h>\n' + content
          with open('drivers/misc/ocp2131_bias/ocp2131_bias.c', 'w') as f:
              f.write(content)
          
          # 2. 修改该驱动的 Makefile 让它不再拦截警告
          with open('drivers/misc/ocp2131_bias/Makefile', 'a') as f:
              f.write('\nsubdir-ccflags-y += -Wno-error\n')
          print("源代码修复完成！")
          EOF
          make O=$GITHUB_WORKSPACE/out vendor/parrot_consolidate.config

      - name: Build Kernel
        run: |
          cd kernel_source
          make O=$GITHUB_WORKSPACE/out -j$(nproc)

