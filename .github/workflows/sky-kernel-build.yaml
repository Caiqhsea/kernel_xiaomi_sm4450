name: Build Sky Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Cleanup Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Setup Swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== Swap 信息 ==="
          free -h
          swapon --show

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex \
            git libelf-dev libssl-dev lz4 make python3 rsync unzip zip zstd \
            libncurses-dev gcc-aarch64-linux-gnu lld clang llvm
          echo "✅ 依赖安装完成"
          clang --version
          llvm-ar --version

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          path: kernel_source
          ref: lineage-20

      - name: Extract scsi drivers
        run: |
          cd kernel_source
          wget https://raw.githubusercontent.com/Caiqhsea/kernel_xiaomi_sm4450/lineage-20/scsi_full.tar.gz
          tar -xzf scsi_full.tar.gz
          rm -f scsi_full.tar.gz

      - name: Fix firmware include path
run: |
cd kernel_source
ln -sf drivers/input/touchscreen/FT8725/include/firmware include/firmware

      - name: Set Environment Variables
run: |
echo "ARCH=arm64" >> $GITHUB_ENV
echo "LLVM=1" >> $GITHUB_ENV
echo "LLVM_IAS=1" >> $GITHUB_ENV
echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
echo "KBUILD_BUILD_USER=github" >> $GITHUB_ENV
echo "KBUILD_BUILD_HOST=actions" >> $GITHUB_ENV

      - name: Remove hqsysfs Driver
run: |
cd kernel_source
rm -rf drivers/misc/hqsysfs
sed -i '/source "drivers\/misc\/hqsysfs\/Kconfig"/d' drivers/misc/Kconfig
sed -i '/obj-$(CONFIG_HQSYSFS)/d' drivers/misc/Makefile
sed -i '/hqsysfs/d' drivers/misc/Makefile

      - name: Disable minidump_log
run: |
cd kernel_source
rm -f drivers/soc/qcom/minidump_log.c
sed -i'/minidump_log/d' drivers/soc/qcom/Makefile

      - name: Disable jtagv8
run: |
cd kernel_source
rm -f drivers/soc/qcom/jtagv8.c
sed -i'/jtagv8/d' drivers/soc/qcom/Makefile

      - name: Fix ufs-qcom.c
run: |
cd kernel_source
sed -i's/dev_warn(dev,/dev_warn(\&hba->pdev->dev,/g'drivers/scsi/ufs/ufs-qcom.c 2>/dev/null || true
sed -i's/dev_err(dev,/dev_err(\&hba->pdev->dev,/g'drivers/scsi/ufs/ufs-qcom.c 2>/dev/null || true
sed -i's/dev_info(dev,/dev_info(\&hba->pdev->dev,/g'drivers/scsi/ufs/ufs-qcom.c 2>/dev/null || true
sed -i's/dev_dbg(dev,/dev_dbg(\&hba->pdev->dev,/g'drivers/scsi/ufs/ufs-qcom.c 2>/dev/null || true

      # ========== 生成配置并清除无用的白名单路径 ==========
      - name: Generate Defconfig
run: |
cd kernel_source
make mrproper
namePackage Kernel
runname
# 第一次 olddefconfig 生成完整配置
make O="$GITHUB_WORKSPACE/out"ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
# 使用 scripts/config 工具禁用 UNUSED_KSYMS_WHITELIST（将其设为空）
./scripts/config --file"$GITHUB_WORKSPACE/out/.config"--set-str CONFIG_UNUSED_KSYMS_WHITELIST""
# 也可以直接删除该行：sed -i '/CONFIG_UNUSED_KSYMS_WHITELIST/d' "$GITHUB_WORKSPACE/out/.config"
# 再次运行 olddefconfig 使配置稳定
make O="$GITHUB_WORKSPACE/out"ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
      # ===================================================

      # ========== 构建内核 ==========
      - name: Build Kernel
run: |
cd kernel_source
make O="$GITHUB_WORKSPACE/out"-j$(nproc) LLVM=1 LLVM_IAS=1 \
$
echo[Fix ufs-qcom.crun{runcd kernel_source[0]}cd kernel_sourcerm -f drivers/soc/qcom/jtagv8.c]sed -i
"❌ 编译失败，以下为错误摘要："
grep -i"error:"run# ========== 生成配置并清除无用的白名单路径 ==========sed -icd kernel_sourcename
head -20
grep -i
# =============================

- |name: Upload build log (if failed)
if: failure()
|uses: actions/upload-artifact@v4
with:
name: build-log
path: build.log

- cp arch/arm64/configs/config"$GITHUB_WORKSPACE/out": "$GITHUB_WORKSPACE/out/.config"
run: |
cd"$GITHUB_WORKSPACE/out"
mkdir -p kernel_package
find . -name"Image*"-exec cp{}kernel_package/ \;
cd kernel_package
zip -r"$GITHUB_WORKSPACE/kernel-full.zip" .

- name: Upload Artifact
uses: actions/upload-artifact@v4
with:
name: kernel-full
path: kernel-full.zip
          retention-days: 7
