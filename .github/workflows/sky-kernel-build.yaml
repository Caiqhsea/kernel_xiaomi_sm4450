  name: Build Kernel
  run: |
    cd kernel_source
    echo "=== 编译完整内核 ==="
    echo "当前内存状态："
    free -h
    
    make O=$GITHUB_WORKSPACE/out -j4 2>&1 | tee $GITHUB_WORKSPACE/build.log
    
    BUILD_STATUS=${PIPESTATUS[0]}
    
    if [ $BUILD_STATUS -ne 0 ]; then
      echo "❌ 编译失败"
      tail -100 $GITHUB_WORKSPACE/build.log
      exit 1
    fi
    
    echo "✅ 编译成功"
    
- name: Package Kernel
  run: |
    cd $GITHUB_WORKSPACE/out
    echo "=== 打包内核 ==="
    
    # 查找生成的 Image 文件
    find . -name "Image" -o -name "Image.gz" -o -name "Image.lz4" | head -5
    
    # 打包所有内核镜像
    mkdir -p kernel_package
    find . -name "Image*" -exec cp {} kernel_package/ \;
    
    cd kernel_package
    zip -r $GITHUB_WORKSPACE/kernel-full.zip .
    
    echo "✅ 打包完成"
    
- name: Upload Artifact
  uses: actions/upload-artifact@v4
  with:
    name: kernel-full
    path: kernel-full.zip
    retention-days: 7
