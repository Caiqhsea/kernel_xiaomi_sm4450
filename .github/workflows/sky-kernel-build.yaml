name: Build Sky Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Cleanup Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Setup Swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== Swap 信息 ==="
          free -h
          swapon --show

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex \
            git libelf-dev libssl-dev lz4 make python3 rsync unzip zip zstd \
            libncurses-dev gcc-aarch64-linux-gnu lld clang llvm
          echo "✅ 依赖安装完成"
          clang --version
          llvm-ar --version

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          path: kernel_source
          ref: temp

      - name: Set Environment Variables
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=github" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=actions" >> $GITHUB_ENV

      - name: Generate Defconfig (with fix)
        run: |
          cd kernel_source
          make mrproper
          mkdir -p "$GITHUB_WORKSPACE/out"
          # 优先使用自定义 config，若不存在则使用 defconfig
          if [ -f arch/arm64/configs/config ]; then
            cp arch/arm64/configs/config "$GITHUB_WORKSPACE/out/.config"
            make O="$GITHUB_WORKSPACE/out" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          else
            make O="$GITHUB_WORKSPACE/out" ARCH=arm64 LLVM=1 LLVM_IAS=1 defconfig
          fi
          # 必要修复：清除可能导致编译失败的白名单路径
          sed -i '/CONFIG_UNUSED_KSYMS_WHITELIST/d' "$GITHUB_WORKSPACE/out/.config" 2>/dev/null || true
          make O="$GITHUB_WORKSPACE/out" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Build Kernel
        run: |
          cd kernel_source
          make O="$GITHUB_WORKSPACE/out" -j$(nproc) LLVM=1 LLVM_IAS=1 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ 编译失败"
            tail -100 "$GITHUB_WORKSPACE/build.log"
            exit 1
          fi

      - name: Upload build log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package Kernel
        run: |
          cd "$GITHUB_WORKSPACE/out"
          mkdir -p kernel_package
          find . -name "Image*" -exec cp {} kernel_package/ \;
          cd kernel_package
          zip -r "$GITHUB_WORKSPACE/kernel-full.zip" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-full
          path: kernel-full.zip
          retention-days: 7
